# TripScape Nginx 配置

upstream django_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 健康检查（直接转发） ----
    location /healthz { proxy_pass http://django_web; }
    location /readyz  { proxy_pass http://django_web; }

    # ---- API（Django Ninja） ----
    location /api/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ---- Django admin ----
    location /admin/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
    }

    # ---- 上传文件（MinIO 代理或本地 runtime/uploads） ----
    location /media/ {
        alias /app/runtime/uploads/;
        expires 7d;
    }

    # ---- 地标百科图片（前端静态） ----
    location /landmarks/ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    # ---- React SPA 静态资源 ----
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|png|jpg|webp|webmanifest|ico)$ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    # ---- SPA 兜底（前端路由） ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
